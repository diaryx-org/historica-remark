# What the shared release tooling needs to know about historica-remark.
# Everything not stated here is a default in lib/repo.nu — the manifest, the
# changelog path, the cliff config, and that this is a Cargo workspace.
name = "historica-remark"
url = "https://github.com/diaryx-org/historica-remark"
release_branch = "main"

# What to run before cutting. Each repo owns its own CI; this names it.
verify = "cargo xtask ci"

# No `tag_starts`: nothing runs on the tag. The GitHub release is cut by
# `release` itself, from the machine that pushed the tag, and every upload to
# crates.io is a `cargo publish` somebody runs deliberately. So the warning
# before the push says exactly that, rather than naming a workflow that does
# not exist.
